[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "td-center"
version = "0.1.0"
description = "Single-frame and temporal IR tropical depression center localization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchvision", "matplotlib", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["td_center*"]
namespaces = false
